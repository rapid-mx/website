<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
  const PAPER = [255,255,255], INK = [13,13,13];
  const ROOF = '173.85,92.97 217,66.12 260.15,92.97 263.85,87.03 217,57.88 170.15,87.03';
  const CX = 300, CY = 122;              // visual centre of the full logo

  // ---------- seeded random so every loop is the same choreography ----------
  let seed = 7; const rnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (b - a) * ((seed - 1) / 2147483646); };

  // ---------- easing ----------
  const E = {
    lin: t => t,
    in2: t => t * t, in3: t => t * t * t,
    out3: t => 1 - Math.pow(1 - t, 3),
    io3: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    expo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
    back: t => { const c = 1.7, d = c + 1; return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3.2) + 1,
    bounce: t => { const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
  };

  // ---------- build the extra layers ----------
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
  const defs = $('defs');

  // shards: jittered triangle grid over the logo, each a clipped copy of the art
  const shards = [];
  { const x0 = 64, x1 = 538, y0 = 52, y1 = 194, cols = 11, rows = 4, pts = [];
    for (let r = 0; r <= rows; r++) { pts[r] = [];
      for (let c = 0; c <= cols; c++) {
        const edge = r === 0 || r === rows || c === 0 || c === cols;
        pts[r][c] = [x0 + (x1 - x0) * c / cols + (edge ? 0 : rnd(-14, 14)), y0 + (y1 - y0) * r / rows + (edge ? 0 : rnd(-9, 9))];
      } }
    let n = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e = pts[r + 1][c + 1];
      const tris = (r + c) % 2 ? [[a, b, e], [a, e, d]] : [[a, b, d], [b, e, d]];
      for (const t of tris) {
        const id = 'sh' + n++;
        const cp = mk('clipPath', { id }, defs);
        mk('polygon', { points: t.map(p => p.join(',')).join(' ') }, cp);
        const g = mk('g', { 'clip-path': `url(#${id})` }, $('#shards'));
        mk('use', { href: '#artSrc' }, g);
        g._o = [(t[0][0] + t[1][0] + t[2][0]) / 3, (t[0][1] + t[1][1] + t[2][1]) / 3];
        shards.push(g);
      }
    } }

  // slices: horizontal bands of the art
  const slices = [];
  { const y0 = 52, y1 = 194, n = 9, h = (y1 - y0) / n;
    for (let i = 0; i < n; i++) {
      const cp = mk('clipPath', { id: 'sl' + i }, defs);
      mk('rect', { x: 0, y: y0 + i * h - .3, width: 700, height: h + .6 }, cp);
      const g = mk('g', { 'clip-path': `url(#sl${i})` }, $('#slices'));
      mk('use', { href: '#artSrc' }, g);
      g._o = [CX, y0 + (i + .5) * h];
      slices.push(g);
    } }

  // chevrons: a stack of rooflines that cascade into one
  const chevs = [];
  for (let i = 0; i < 9; i++) { const p = mk('polygon', { points: ROOF, class: 'chev' }, $('#chevs')); p._o = [217, 75]; chevs.push(p); }

  const letters = $$('#letters .L'), tag = $$('#tag .t'), roof = $('#roof'), outlines = $$('#outline .o');
  const groups = { art: $('#art'), outline: $('#outline'), chevs: $('#chevs'), shards: $('#shards'), slices: $('#slices') };
  for (const el of [...letters, ...tag, ...outlines]) { const b = el.getBBox(); el._o = [b.x + b.width / 2, b.y + b.height / 2]; }
  roof._o = [217, 75];
  outlines.forEach(o => { o._len = o.getTotalLength(); o.style.strokeDasharray = o._len; });

  // ---------- tiny deterministic timeline ----------
  const tracks = new Map();     // el -> {prop: [tweens]}
  const add = (el, prop, start, dur, from, to, ease) => {
    if (!tracks.has(el)) tracks.set(el, {});
    const t = tracks.get(el); (t[prop] = t[prop] || []).push({ start, dur, from, to, ease: E[ease] || E.lin });
  };
  // tw(targets, {prop:[from,to]}, start, dur, ease, stagger)
  const tw = (els, props, start, dur, ease = 'out3', stagger = 0) => {
    els = Array.isArray(els) ? els : [els];
    els.forEach((el, i) => {
      const s = start + (typeof stagger === 'function' ? stagger(i, el) : i * stagger);
      for (const p in props) {
        let [f, t] = props[p];
        f = typeof f === 'function' ? f(i, el) : f; t = typeof t === 'function' ? t(i, el) : t;
        add(el, p, s, dur, f, t, ease);
      }
    });
  };
  const set = (els, props, at) => { const o = {}; for (const p in props) o[p] = [props[p], props[p]]; tw(els, o, at, 0); };
  const DEF = { x: 0, y: 0, r: 0, s: 1, sx: 1, sy: 1, o: 1, dash: 0 };

  const randOrder = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd(0, i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fromCentre = (arr, each) => (i, el) => Math.abs(el._o[0] - CX) / 240 * each * arr.length / 2;
  const alt = i => (i % 2 ? 1 : -1);
  const all = [...letters, roof, ...tag];
  const G = groups;
  const glob = { bg: [], lf: [] };
  const gtw = (k, start, dur, f, t, ease = 'io3') => glob[k].push({ start, dur, from: f, to: t, ease: E[ease] });

  // ================= CHOREOGRAPHY =================
  let T = 0;
  // reset
  set([G.art], { o: 1 }, 0); set([G.outline, G.chevs, G.shards, G.slices], { o: 0 }, 0);
  gtw('bg', 0, 0, 0, 0); gtw('lf', 0, 0, 0, 0);
  set([roof, ...tag], { x: 0, r: 0, s: 1, sx: 1, sy: 1 }, 0);

  // 1 · SCATTER → ASSEMBLE: broken parts becoming one
  T = .3;
  const ord = randOrder(letters.length);
  tw(letters, { x: [() => rnd(-520, 520), 0], y: [() => rnd(-240, 240), 0], r: [() => rnd(-220, 220), 0], s: [.15, 1], o: [0, 1] }, T, 1.5, 'expo', (i) => ord[i] * .11);
  tw(roof, { y: [-170, 0], r: [-30, 0], o: [0, 1] }, T + 1.1, 1.1, 'bounce');
  tw(tag, { y: [14, 0], o: [0, 1] }, T + 1.6, .55, 'out3', .035);
  T += 4.4;

  // 2 · TREMBLE → SHATTER: one becoming broken parts
  [ -3, 3, -2, 2, -1, 0 ].forEach((v, k) => set(all, { x: v }, T + k * .05));
  T += .32;
  set([G.art], { o: 0 }, T); set([G.shards], { o: 1 }, T);
  tw(shards, {
    x: [0, (i, g) => (g._o[0] - CX) * rnd(.9, 2.2) + rnd(-40, 40)],
    y: [0, (i, g) => (g._o[1] - CY) * rnd(2, 4.5) + rnd(30, 120)],
    r: [0, () => rnd(-260, 260)], s: [1, () => rnd(.3, .8)], o: [1, 0]
  }, T, 1.7, 'out3', (i, g) => Math.hypot(g._o[0] - CX, g._o[1] - CY) / 260 * .25);
  T += 2.1;

  // 3 · ROOF FIRST, THEN THE HOUSE RISES
  set([G.shards], { o: 0 }, T); set([G.art], { o: 1 }, T);
  set(letters, { x: 0, r: 0, s: 1, o: 1, y: 90 }, T); set(tag, { o: 0, x: 0, y: 0 }, T);
  set(roof, { x: 0, r: 0 }, T);
  tw(roof, { s: [0, 1], o: [1, 1], y: [40, 0] }, T, 1.2, 'elastic');
  tw(letters, { y: [90, 0] }, T + .7, .9, 'back', .1);
  tw(tag, { x: [(i, e) => (CX - e._o[0]) * .92, 0], o: [0, 1] }, T + 1.5, 1.1, 'expo');
  T += 4.2;

  // 4 · SLICE APART
  set([G.art], { o: 0 }, T); set([G.slices], { o: 1 }, T);
  tw(slices, { x: [0, i => alt(i) * 760], o: [1, 0] }, T, .9, 'in3', .045);
  T += 1.3;

  // 5 · SLICE BACK TOGETHER — reversed (white on ink)
  gtw('bg', T - .5, .7, 0, 1); gtw('lf', T - .5, .01, 0, 1);
  tw(slices, { x: [i => -alt(i) * 760, 0], o: [0, 1] }, T, 1.1, 'expo', .06);
  T += 1.8;
  set([G.slices], { o: 0 }, T); set([G.art], { o: 1 }, T);
  tw(roof, { s: [1, 1.07] }, T + .2, .25, 'out3'); tw(roof, { s: [1.07, 1] }, T + .45, .5, 'back');
  T += 1.7;

  // 6 · COLLAPSE INTO THE A, ROOFLINES RAIN DOWN, LETTERS BURST BACK OUT
  const AX = 217;
  tw(letters, { x: [0, (i, e) => AX - e._o[0]], s: [1, .1], o: [1, 0] }, T, .7, 'in3', 0);
  tw(tag, { o: [1, 0], y: [0, 10] }, T, .4, 'in2', .012);
  gtw('bg', T + .2, .8, 1, 0); gtw('lf', T + .9, .01, 1, 0);
  T += .9;
  set([G.chevs], { o: 1 }, T);
  chevs.forEach((c, i) => {
    const s = T + i * .1, h = -60 - (chevs.length - i) * 26;
    tw(c, { y: [h, 0] , o: [0, 1] }, s, .55, 'in2');
    tw(c, { o: [1, 0] }, s + .55, .12, 'lin');
    tw(roof, { sy: [.82, 1] }, s + .55, .3, 'out3');
  });
  T += chevs.length * .1 + .8;
  set([G.chevs], { o: 0 }, T);
  tw(letters, { x: [(i, e) => AX - e._o[0], 0], s: [.1, 1], o: [0, 1], r: [() => rnd(-90, 90), 0] }, T, 1.1, 'back', (i, e) => Math.abs(e._o[0] - AX) / 310 * .25);
  tw(tag, { o: [0, 1], y: [10, 0] }, T + .6, .5, 'out3', (i, e) => Math.abs(e._o[0] - CX) / 230 * .45);
  T += 3.2;

  // 7 · LINE DRAWING → FILL
  tw(letters, { o: [1, 0] }, T, .45, 'io3', .05);
  tw(tag, { o: [1, .15] }, T, .45, 'io3');
  set([G.outline], { o: 1 }, T);
  outlines.forEach((o, i) => tw(o, { dash: [o._len, 0], o: [1, 1] }, T + .15 + i * .14, 1.7, 'io3'));
  tw(roof, { sx: [1, -1] }, T + .4, .8, 'io3'); tw(roof, { sx: [-1, 1] }, T + 1.3, .8, 'io3');
  T += 2.5;
  tw(letters, { o: [0, 1] }, T, .6, 'out3', .08);
  tw(tag, { o: [.15, 1] }, T + .3, .6, 'out3');
  tw(outlines, { o: [1, 0] }, T + .5, .6, 'io3');
  T += 3.1;

  // 8 · GRAVITY: everything drops away, roof floats off, loop
  tw([...letters, ...tag], {
    y: [0, () => rnd(220, 330)], r: [0, () => rnd(-70, 70)], o: [1, 0]
  }, T, 1.1, 'in3', () => rnd(0, .45));
  tw(roof, { y: [0, -90], o: [1, 0] }, T + .5, 1.1, 'in2');
  T += 2.1;

  const DUR = T;

  // ---------- renderer ----------
  const val = (tws, t) => {
    let v = tws[0].from;
    for (const w of tws) {
      if (t < w.start) break;
      v = w.dur === 0 || t >= w.start + w.dur ? w.to : w.from + (w.to - w.from) * w.ease((t - w.start) / w.dur);
    }
    return v;
  };
  const sortAll = () => { for (const [, ps] of tracks) for (const p in ps) ps[p].sort((a, b) => a.start - b.start); glob.bg.sort((a, b) => a.start - b.start); glob.lf.sort((a, b) => a.start - b.start); };
  sortAll();
  const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;
  const root = document.documentElement;

  const render = t => {
    for (const [el, ps] of tracks) {
      const s = { ...DEF };
      for (const p in ps) s[p] = val(ps[p], t);
      if (el._o) {
        const [ox, oy] = el._o;
        el.setAttribute('transform', `translate(${s.x} ${s.y}) translate(${ox} ${oy}) rotate(${s.r}) scale(${s.s * s.sx} ${s.s * s.sy}) translate(${-ox} ${-oy})`);
      }
      el.style.opacity = Math.max(0, Math.min(1, s.o));
      if ('dash' in ps) el.style.strokeDashoffset = s.dash;
    }
    const bg = mix(PAPER, INK, val(glob.bg, t));
    document.body.style.background = bg;
    root.style.setProperty('--lf', mix(INK, PAPER, val(glob.lf, t)));
  };

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.__rapid = { render, DUR };
  if (still) { render(DUR - 2.2 - 3.2); return; }
  let t0 = null;
  const frame = now => { if (t0 === null) t0 = now; render(window.__freeze != null ? window.__freeze : ((now - t0) / 1000) % DUR); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
